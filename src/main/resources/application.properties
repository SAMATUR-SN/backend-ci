# Nom de l'application
spring.application.name=samatur

# Configuration PostgreSQL, surchargeable par l'environnement
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/samatur_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Migrations Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Configuration JWT fournie par l'environnement
samatur.jwt.secret=${SAMATUR_JWT_SECRET}
samatur.jwt.expiration=${SAMATUR_JWT_EXPIRATION:86400000}
samatur.cors.allowed-origins=${SAMATUR_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
logging.level.org.springframework.security=DEBUG
