# Nom de l'application
spring.application.name=samatur

# Configuration PostgreSQL, surchargeable par l'environnement
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/samatur_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA : Flyway crée le schéma, Hibernate le vérifie seulement ; pas de SQL dans les logs
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Les DTO sont construits dans les transactions des services : aucune requête SQL pendant la conversion en JSON
spring.jpa.open-in-view=false

# Migrations Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# /health à la racine (Docker, Traefik, pipeline CD), sans détail sur la base
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

# Jeton JWT : clé fournie par l'environnement, valable 8 heures (en millisecondes)
samatur.jwt.secret=${SAMATUR_JWT_SECRET}
samatur.jwt.expiration=${SAMATUR_JWT_EXPIRATION:28800000}

# Délai cible des alertes de retard (RG-05), en jours. C'est une cible du projet, pas un délai légal.
samatur.delai-cible-jours=${SAMATUR_DELAI_CIBLE_JOURS:15}
